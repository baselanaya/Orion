---
- name: restart orion-awg
  ansible.builtin.systemd:
    name: orion-awg
    state: restarted

- name: restart wg-hop
  ansible.builtin.systemd:
    name: wg-quick@wg-hop
    state: restarted

- name: reload nftables
  ansible.builtin.systemd:
    name: nftables
    state: reloaded

- name: reload sysctl
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-orion.conf
  changed_when: false
