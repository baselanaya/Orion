---
# AmneziaWG egress (plain-WG keys/peers, obfuscated protocol).
# The wireguard kernel module is replaced by the amneziawg DKMS module from
# Amnezia's Launchpad PPA (suite "noble" works on Debian 13 per upstream).

- name: Install kernel headers (running kernel + latest, for DKMS)
  ansible.builtin.apt:
    name:
      - linux-headers-amd64
      - "linux-headers-{{ ansible_kernel }}"
    state: present

- name: Ensure 1G swap exists (DKMS build insurance on the 512MB droplet)
  ansible.builtin.shell: |
    set -e
    if ! swapon --show=NAME --noheadings | grep -q .; then
      fallocate -l 1G /swapfile
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
      echo "/swapfile none swap sw 0 0" >> /etc/fstab
    fi
  args:
    executable: /bin/bash
    creates: /swapfile

- name: Trust the Amnezia PPA signing key (fingerprint-pinned)
  ansible.builtin.shell: |
    set -e
    curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x75C9DD72C799870E310542E24166F2C257290828" \
      | gpg --batch --no-tty --yes --dearmor -o /etc/apt/keyrings/amnezia-ppa.gpg
    got="$(gpg --batch --no-tty --show-keys --with-colons /etc/apt/keyrings/amnezia-ppa.gpg | awk -F: '/^fpr:/{print $10; exit}')"
    [ "$got" = "75C9DD72C799870E310542E24166F2C257290828" ]
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/amnezia-ppa.gpg

- name: Add Amnezia PPA (noble suite, DEB822)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/amnezia-ppa.sources
    content: |
      Types: deb
      URIs: https://ppa.launchpadcontent.net/amnezia/ppa/ubuntu
      Suites: noble
      Components: main
      Signed-By: /etc/apt/keyrings/amnezia-ppa.gpg
    owner: root
    group: root
    mode: "0644"
  register: awg_repo

- name: Install AmneziaWG (kernel module via DKMS + tools)
  ansible.builtin.apt:
    name:
      - amneziawg
      - amneziawg-tools
      - amneziawg-dkms
    state: present
    update_cache: true
  register: awg_install

- name: Load the amneziawg module at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/amneziawg.conf
    content: "amneziawg\n"
    owner: root
    group: root
    mode: "0644"

- name: Enable IPv4 forwarding (plan §5.3)
  ansible.builtin.template:
    src: sysctl_orion.conf.j2
    dest: /etc/sysctl.d/99-orion.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload sysctl

- name: Install the egress nftables ruleset
  ansible.builtin.template:
    src: nftables-egress.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  notify: reload nftables

- name: Enable nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Check for existing server key
  ansible.builtin.stat:
    path: /etc/wireguard/egress.key
  register: server_key

- name: Generate server private key (kept on this node only)
  ansible.builtin.shell: "umask 077 && wg genkey > /etc/wireguard/egress.key"
  when: not server_key.stat.exists
  no_log: true

- name: Read server private key
  ansible.builtin.slurp:
    src: /etc/wireguard/egress.key
  register: server_key_b64
  no_log: true

- name: Set server private key fact
  ansible.builtin.set_fact:
    orion_server_private_key: "{{ server_key_b64.content | b64decode | trim }}"
  no_log: true

- name: Derive server public key
  ansible.builtin.shell: "wg pubkey < /etc/wireguard/egress.key"
  changed_when: false
  register: server_pubkey

- name: Validate peer list
  ansible.builtin.assert:
    that:
      - p.name is defined
      - p.mode is defined
      - p.ip is defined
      - p.pubkey is defined and p.pubkey | length > 0
    fail_msg: >-
      peer '{{ p.name | default("unnamed") }}' is incomplete — generate a keypair
      with scripts/new-peer.sh and paste the pubkey into host_vars/egress-1.yml
  loop: "{{ orion_peers }}"
  loop_control:
    loop_var: p
  when: orion_peers | length > 0

- name: Retire the plain WireGuard interface
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: false
    state: stopped
  failed_when: false

- name: Generate the mobile listener (wg1) server key
  ansible.builtin.shell: "umask 077 && wg genkey > /etc/wireguard/wg1.key"
  args:
    creates: /etc/wireguard/wg1.key
  no_log: true

- name: Read the wg1 server key
  ansible.builtin.slurp:
    src: /etc/wireguard/wg1.key
  register: wg1_key_b64
  no_log: true

- name: Set the wg1 private key fact
  ansible.builtin.set_fact:
    orion_wg1_private_key: "{{ wg1_key_b64.content | b64decode | trim }}"
  no_log: true

- name: Install the mobile listener configuration (wg1)
  ansible.builtin.template:
    src: wg1.conf.j2
    dest: /etc/wireguard/wg1.conf
    owner: root
    group: root
    mode: "0600"
  notify: restart wg1

- name: Install the mobile listener systemd unit
  ansible.builtin.template:
    src: orion-wg1.service.j2
    dest: /etc/systemd/system/orion-wg1.service
    owner: root
    group: root
    mode: "0644"
  notify: restart wg1

- name: Enable the mobile listener at boot
  ansible.builtin.systemd:
    name: orion-wg1
    enabled: true
    state: started
    daemon_reload: true

- name: Install awg0 configuration (obfuscated)
  ansible.builtin.template:
    src: awg0.conf.j2
    dest: /etc/amnezia/awg0.conf
    owner: root
    group: root
    mode: "0600"
  notify: restart orion-awg

- name: Install the orion-awg systemd unit
  ansible.builtin.template:
    src: orion-awg.service.j2
    dest: /etc/systemd/system/orion-awg.service
    owner: root
    group: root
    mode: "0644"
  notify: restart orion-awg

- name: Enable the obfuscated tunnel at boot
  ansible.builtin.systemd:
    name: orion-awg
    enabled: true
    state: started
    daemon_reload: true

- name: Install the entry<->egress hop configuration
  ansible.builtin.template:
    src: wg-hop.conf.j2
    dest: /etc/wireguard/wg-hop.conf
    owner: root
    group: root
    mode: "0600"
  when: orion_hop_private_key is defined and orion_hop_peer_pub is defined
  notify: restart wg-hop

- name: Enable the hop tunnel
  ansible.builtin.systemd:
    name: wg-quick@wg-hop
    enabled: true
    state: started
  when: orion_hop_private_key is defined and orion_hop_peer_pub is defined

- name: Report client-side endpoint parameters
  ansible.builtin.debug:
    msg:
      server_public_key: "{{ server_pubkey.stdout | trim }}"
      endpoint: "<this-node-ip>:{{ orion_wg_port }}"
      obfuscation: "Jc={{ orion_awg_jc }} Jmin={{ orion_awg_jmin }} Jmax={{ orion_awg_jmax }} S1={{ orion_awg_s1 }} S2={{ orion_awg_s2 }}"
      note: "Client profiles must carry the same AWG parameters - see docs/phase-1.md"
