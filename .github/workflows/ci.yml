name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - name: tooling
        run: uv sync
      - name: ansible playbook syntax
        run: uv run ansible-playbook --syntax-check -i ansible/inventory.example.yml ansible/site.yml
      - name: templates + YAML strict validation
        run: uv run python scripts/validate_ansible.py
      - name: js syntax
        run: node --check client/app/ui/main.js

  cross-platform-check:
    strategy:
      matrix:
        include:
          - { os: windows-latest }
          - { os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "client" }
      - name: cross-platform compile check (app + protocol; helper is Linux-first)
        run: |
          cd client
          cargo check --release -p orion-ipc -p orion-app

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: tauri linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "client" }
      - name: build client + helper (release)
        run: |
          cd client
          cargo build --release -p orion-ipc -p orion-helper -p orion-app
      - name: protocol tests
        run: |
          cd client
          cargo test --release -p orion-ipc
